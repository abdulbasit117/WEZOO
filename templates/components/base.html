{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>documen</title>
    <link rel="stylesheet" href="{% static 'css/style1.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style3.css' %}" />
    <link rel="stylesheet" href="{% static 'css/kaс.css' %}" />
    <link rel="stylesheet" href="{% static 'css/card1.css' %}" />
    <link rel="stylesheet" href="{% static 'css/bron1.css' %}" />
    <link rel="stylesheet" href="{% static 'css/users.css' %}" />
    <link rel="stylesheet" href="{% static 'css/pro.css' %}" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="wz-header">
        <div class="wz-container">
            <div class="wz-logo-wrapper">
                <a href="{% url 'main-page' %}" class="wz-logo-text">WEZOO</a>
            </div>

            <nav class="wz-nav-box">
                <ul class="wz-menu-list">
                    <li class="wz-menu-item"><a href="/hov" class="wz-menu-link">Как это работает</a></li>
                    <li class="wz-menu-item"><a href="/about" class="wz-menu-link">О нас</a></li>
                    <li class="wz-menu-item"><a href="/contact" class="wz-menu-link">Контакт</a></li>
                </ul>

                <div class="wz-actions-group">
                    {% if request.user.is_authenticated %}
                    <a href="/profile/"><div class="wz-badge-counter">{{request.user.username}}</div></a>
                    
                    <button type="button" style="color: black; border-bottom: none;" class="wz-btn-logout"><a
                            href="/logout">logout</a></button>
                    {% else %}
                    <li class="btn-link"><a href="/login">Войдите</a></li>
                    {% endif %}
                    

                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}

        {% endblock %}
    </main>

</body>

</html>
