name: Deploy Wezoo Project

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Restart Docker Containers
        run: |
          # Переходим в папку проекта (замени на свой путь, если другой)
          cd /home/abdulvaliy1/WEZOO/ 
          sudo docker compose down
          sudo docker compose up -d --build
          sudo docker compose exec -T main python manage.py migrate
          sudo docker compose exec -T main python manage.py collectstatic --noinput